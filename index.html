<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>רשת הפעולות הטובות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .user-icon { position: absolute; cursor: pointer; transition: transform 0.3s; }
        .user-icon:hover { transform: scale(1.2); }
        #modal { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen overflow-hidden">

    <h1 class="text-3xl font-bold text-center mt-10">הפעולות המיטיבות שלנו</h1>
    
    <div id="container" class="relative w-full h-[80vh]"></div>

    <div id="modal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h2 id="modalTitle" class="text-2xl font-bold"></h2>
                <button onclick="closeModal()" class="text-red-500 font-bold text-xl">X</button>
            </div>
            <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'shantupai'; // החלף בשם המשתמש שלך
        const REPO_NAME = 'personalaccounts';

        async function init() {
            const container = document.getElementById('container');
            // משיכת ה-Issues מגיטהאב
            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues`);
            const issues = await response.json();

            issues.forEach(issue => {
                const btn = document.createElement('div');
                btn.className = 'user-icon w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-xl text-xl font-bold';
                btn.innerText = issue.title.charAt(0).toUpperCase();
                
                // פיזור רנדומלי על המסך
                btn.style.left = Math.random() * 80 + 10 + '%';
                btn.style.top = Math.random() * 70 + 10 + '%';
                
                btn.onclick = () => openGallery(issue);
                container.appendChild(btn);
            });
        }

        async function openGallery(issue) {
            document.getElementById('modalTitle').innerText = `הפעולות של ${issue.title}`;
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = 'טוען פעולות...';
            document.getElementById('modal').style.display = 'flex';

            const response = await fetch(issue.comments_url);
            const comments = await response.json();

            gallery.innerHTML = '';
            comments.forEach(comment => {
                // חילוץ לינק לתמונה מהטקסט
                const imgMatch = comment.body.match(/https?:\/\/[^\s]+?\.(jpg|jpeg|png|gif|webp)/i);
                if (imgMatch) {
                    const img = document.createElement('img');
                    img.src = imgMatch[0];
                    img.className = "w-full h-48 object-cover rounded-lg shadow-md";
                    gallery.appendChild(img);
                }
            });
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        init();
    </script>
</body>
</html>
