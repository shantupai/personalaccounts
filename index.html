<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>רשת הפעולות הטובות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .user-icon { position: absolute; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .user-icon:hover { transform: scale(1.15) rotate(5deg); z-index: 10; }
        #modal { display: none; backdrop-filter: blur(8px); }
        .gallery-img { transition: transform 0.3s; }
        .gallery-img:hover { transform: scale(1.02); }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen overflow-hidden font-sans">

    <h1 class="text-4xl font-black text-center mt-12 text-indigo-900 drop-shadow-sm">רשת המעשים הטובים</h1>
    <p class="text-center text-indigo-600 mt-2">לחצו על משתמש כדי לראות את הטוב שהפיץ בעולם</p>
    
    <div id="container" class="relative w-full h-[75vh]"></div>

    <div id="modal" class="fixed inset-0 bg-indigo-950/40 flex items-center justify-center z-50 p-4" onclick="closeModalOutside(event)">
        <div class="bg-white rounded-3xl shadow-2xl max-w-3xl w-full max-h-[85vh] overflow-hidden flex flex-col" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center p-6 border-b bg-gray-50">
                <h2 id="modalTitle" class="text-2xl font-bold text-indigo-900"></h2>
                <button onclick="closeModal()" class="bg-red-100 text-red-600 hover:bg-red-200 w-10 h-10 rounded-full font-bold transition-colors">✕</button>
            </div>
            <div id="gallery" class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-6 overflow-y-auto">
                </div>
        </div>
    </div>

    <script>
        // --- עדכן כאן את הפרטים שלך ---
        const REPO_OWNER = 'shantupai'; 
        const REPO_NAME = 'personalaccounts';
        // ------------------------------

        async function init() {
            try {
                const container = document.getElementById('container');
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues`);
                const issues = await response.json();

                if (issues.length === 0) {
                    container.innerHTML = '<p class="text-center mt-20">לא נמצאו חשבונות (Issues) בריפו.</p>';
                }

                issues.forEach(issue => {
                    const btn = document.createElement('div');
                    btn.className = 'user-icon w-20 h-20 bg-white border-4 border-indigo-400 rounded-2xl flex items-center justify-center text-indigo-600 shadow-xl text-2xl font-black';
                    btn.innerText = issue.title.charAt(0).toUpperCase();
                    
                    // מיקום רנדומלי חכם שלא ייצא מהמסך
                    btn.style.left = Math.random() * 70 + 10 + '%';
                    btn.style.top = Math.random() * 60 + 10 + '%';
                    
                    btn.onclick = () => openGallery(issue);
                    container.appendChild(btn);
                });
            } catch (e) {
                console.error("שגיאה בטעינה:", e);
            }
        }

        async function openGallery(issue) {
            const modal = document.getElementById('modal');
            const gallery = document.getElementById('gallery');
            document.getElementById('modalTitle').innerText = `הפעולות של ${issue.title}`;
            
            gallery.innerHTML = '<div class="col-span-full text-center py-10 text-indigo-400">מחפש תמונות...</div>';
            modal.style.display = 'flex';

            try {
                const response = await fetch(issue.comments_url);
                const comments = await response.json();

                gallery.innerHTML = '';
                let foundImages = false;

                comments.forEach(comment => {
                    // ביטוי רגולרי משופר שמוצא לינקים של תמונות בתוך Markdown או לינקים ישירים
                    const imgRegex = /https?:\/\/[^\s\)]+?\.(jpg|jpeg|png|gif|webp)/gi;
                    const matches = comment.body.match(imgRegex);

                    if (matches) {
                        matches.forEach(url => {
                            foundImages = true;
                            const imgContainer = document.createElement('div');
                            imgContainer.className = "group relative overflow-hidden rounded-xl bg-gray-100 aspect-video shadow-md";
                            
                            const img = document.createElement('img');
                            img.src = url;
                            img.className = "gallery-img w-full h-full object-cover pointer-events-none";
                            
                            imgContainer.appendChild(img);
                            gallery.appendChild(imgContainer);
                        });
                    }
                });

                if (!foundImages) {
                    gallery.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500 italic">לא נמצאו תמונות בתגובות של חשבון זה. וודאו שהעליתם תמונה לתגובה.</div>';
                }
            } catch (e) {
                gallery.innerHTML = 'שגיאה בטעינת התמונות.';
            }
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function closeModalOutside(e) { if(e.target.id === 'modal') closeModal(); }
        
        init();
    </script>
</body>

</html>
