<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>רשת המעשים הטובים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .user-icon { position: absolute; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .user-icon:hover { transform: scale(1.1) rotate(3deg); z-index: 10; }
        #modal { display: none; backdrop-filter: blur(12px); }
        .gallery-img { width: 100%; height: 250px; object-fit: cover; border-radius: 1rem; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div class="pt-12 pb-6 text-center">
        <h1 class="text-4xl font-black text-slate-900 tracking-tight">הפעולות המיטיבות שלנו</h1>
        <p class="text-slate-500 mt-2 text-lg">לחצו על עיגול לצפייה בגלריה</p>
    </div>
    
    <div id="container" class="relative w-full h-[70vh]"></div>

    <div id="modal" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4" onclick="closeModalOutside(event)">
        <div class="bg-white rounded-[2rem] shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col" onclick="event.stopPropagation()">
            <div class="p-6 border-b flex justify-between items-center bg-white sticky top-0">
                <h2 id="modalTitle" class="text-2xl font-bold text-slate-800"></h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl p-2">✕</button>
            </div>
            <div id="gallery" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6 overflow-y-auto bg-slate-50">
                </div>
        </div>
    </div>

    <script>
        // --- עדכן כאן את הפרטים שלך ---
        const REPO_OWNER = 'shantupai'; 
        const REPO_NAME = 'personalaccounts
';

        async function init() {
            const container = document.getElementById('container');
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?state=all`);
                const issues = await res.json();

                issues.forEach(issue => {
                    const el = document.createElement('div');
                    el.className = 'user-icon w-20 h-20 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-full flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-indigo-200';
                    el.innerText = issue.title.charAt(0);
                    el.style.left = Math.random() * 80 + 10 + '%';
                    el.style.top = Math.random() * 70 + 10 + '%';
                    el.onclick = () => openGallery(issue);
                    container.appendChild(el);
                });
            } catch (e) { console.error(e); }
        }

        async function openGallery(issue) {
            const modal = document.getElementById('modal');
            const gallery = document.getElementById('gallery');
            document.getElementById('modalTitle').innerText = `הפעולות של ${issue.title}`;
            gallery.innerHTML = '<p class="col-span-full text-center py-20 text-slate-400 animate-pulse">מחפש תמונות בתוך התגובות...</p>';
            modal.style.display = 'flex';

            try {
                const res = await fetch(issue.comments_url);
                const comments = await res.json();
                gallery.innerHTML = '';
                
                let foundImages = false;

                comments.forEach(comment => {
                    // חיפוש לינקים לתמונות בצורה רחבה יותר
                    // מחפש כתובות שמתחילות ב-http ומכילות מילים שקשורות להעלאות של גיטהאב או סיומות נפוצות
                    const urlRegex = /(https?:\/\/[^\s\)]+(?:githubusercontent\.com|assets\.github\.com|user-images\.githubusercontent\.com)[^\s\)]+|(https?:\/\/[^\s\)]+\.(?:jpg|jpeg|png|gif|webp|heic)))/gi;
                    const matches = comment.body.match(urlRegex);

                    if (matches) {
                        matches.forEach(url => {
                            // ניקוי סוגריים אם נשארו מה-Markdown
                            const cleanUrl = url.replace(/[()]/g, '');
                            foundImages = true;
                            const img = document.createElement('img');
                            img.src = cleanUrl;
                            img.className = 'gallery-img shadow-md border-4 border-white hover:shadow-xl transition-shadow';
                            gallery.appendChild(img);
                        });
                    }
                });

                if (!foundImages) {
                    gallery.innerHTML = '<div class="col-span-full text-center py-20"><p class="text-slate-500 text-lg italic">לא מצאתי תמונות בתגובות של האישיו הזה.</p><p class="text-sm text-slate-400 mt-2">וודא שהעלית תמונה (Upload) ולא רק כתבת טקסט.</p></div>';
                }
            } catch (e) {
                gallery.innerHTML = 'שגיאה בחיבור לגיטהאב.';
            }
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function closeModalOutside(e) { if(e.target.id === 'modal') closeModal(); }

        init();
    </script>
</body>
</html>
