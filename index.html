<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>רשת המעשים הטובים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .user-icon { position: absolute; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .user-icon:hover { transform: scale(1.1) rotate(3deg); z-index: 10; }
        #modal { display: none; backdrop-filter: blur(12px); }
        .img-card { width: 100%; height: auto; max-height: 450px; object-fit: contain; border-radius: 1.5rem; background: white; border: 8px solid white; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div class="pt-12 text-center">
        <h1 class="text-4xl font-black text-indigo-900 drop-shadow-sm tracking-tight">רשת המעשים הטובים</h1>
        <p id="status-msg" class="text-indigo-500 mt-2 text-lg italic font-medium">טוען את הנתונים מהשטח...</p>
    </div>
    
    <div id="container" class="relative w-full h-[75vh]"></div>

    <div id="modal" class="fixed inset-0 bg-indigo-950/40 flex items-center justify-center z-50 p-4" onclick="this.style.display='none'">
        <div class="bg-white rounded-[2.5rem] shadow-2xl max-w-3xl w-full max-h-[85vh] flex flex-col overflow-hidden" onclick="event.stopPropagation()">
            <div class="p-6 border-b flex justify-between items-center bg-white sticky top-0">
                <h2 id="modalTitle" class="text-2xl font-black text-indigo-800"></h2>
                <button onclick="document.getElementById('modal').style.display='none'" class="bg-slate-100 text-slate-400 hover:text-red-500 w-10 h-10 rounded-full font-bold transition-colors">✕</button>
            </div>
            <div id="gallery" class="p-8 grid grid-cols-1 gap-8 overflow-y-auto bg-slate-50">
                </div>
        </div>
    </div>

    <script>
        const USER = 'shantupai'; 
        const REPO = 'personalaccounts';

        // פונקציה שמחלצת לינקים של תמונות מטקסט (Markdown)
        function findImagesInText(text) {
            if (!text) return [];
            const regex = /(https?:\/\/[^\s\)]+(?:user-attachments|assets|user-images)[^\s\)]+)/gi;
            const matches = text.match(regex);
            return matches ? matches.map(url => url.replace(/[()\[\]]/g, '').split('?')[0]) : [];
        }

        async function loadApp() {
            try {
                const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/issues?state=all&t=${Date.now()}`);
                const issues = await res.json();
                
                if (issues.length > 0) document.getElementById('status-msg').innerText = "לחצו על חשבון לצפייה בגלריה";

                issues.forEach(issue => {
                    const bubble = document.createElement('div');
                    bubble.className = 'user-icon w-24 h-24 bg-gradient-to-tr from-indigo-600 to-purple-500 text-white rounded-full flex items-center justify-center text-2xl font-black shadow-2xl border-4 border-white';
                    bubble.innerText = issue.title.charAt(0).toUpperCase();
                    bubble.style.left = Math.random() * 70 + 10 + '%';
                    bubble.style.top = Math.random() * 60 + 10 + '%';
                    bubble.onclick = () => showGallery(issue);
                    document.getElementById('container').appendChild(bubble);
                });
            } catch (e) { document.getElementById('status-msg').innerText = "שגיאה בחיבור לגיטהאב"; }
        }

        async function showGallery(issue) {
            const modal = document.getElementById('modal');
            const gallery = document.getElementById('gallery');
            document.getElementById('modalTitle').innerText = `הפעולות של ${issue.title}`;
            gallery.innerHTML = '<p class="text-center py-10 text-indigo-400 animate-pulse font-medium text-lg">אוסף את רגעי הטוב...</p>';
            modal.style.display = 'flex';

            try {
                // 1. קח תמונות מהתיאור הראשי של האישיו (Body)
                let allImageUrls = findImagesInText(issue.body);

                // 2. קח תמונות מהתגובות
                const res = await fetch(issue.comments_url);
                const comments = await res.json();
                comments.forEach(c => {
                    const imgsInComment = findImagesInText(c.body);
                    allImageUrls = allImageUrls.concat(imgsInComment);
                });

                // הצגת התמונות
                gallery.innerHTML = '';
                if (allImageUrls.length === 0) {
                    gallery.innerHTML = '<div class="text-center py-20 text-slate-400 italic">לא נמצאו תמונות בחשבון זה.</div>';
                } else {
                    allImageUrls.forEach(url => {
                        const img = document.createElement('img');
                        img.src = url;
                        img.className = 'img-card';
                        img.onerror = () => img.style.display = 'none';
                        gallery.appendChild(img);
                    });
                }
            } catch (e) { gallery.innerHTML = 'שגיאה בטעינת הגלריה.'; }
        }
        loadApp();
    </script>
</body>
</html>
