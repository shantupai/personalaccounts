<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joulie - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root { --primary: #2ecc71; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', system-ui; background: #f4f7f6; margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1000px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .account-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center; transition: 0.3s; cursor: pointer; border: 2px solid transparent; }
        .account-card:hover { transform: translateY(-10px); border-color: var(--primary); }
        .icon-circle { width: 80px; height: 80px; background: #e8f8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 40px; }
        .total-joules { font-size: 24px; font-weight: bold; color: var(--primary); margin: 10px 0; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; overflow-y: auto; }
        .modal-content { background: white; max-width: 600px; margin: 50px auto; padding: 30px; border-radius: 20px; }
        .image-gallery img { width: 100%; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>החשבונות שלי ⚡</h1>
        <button class="btn" onclick="alert('כדי להעלות: היכנס ל-Issue בגיטהאב והוסף תגובה עם תמונה ומילת מפתח (#laundry)')">העלאת פעולה חדשה</button>
    </div>
    <div id="grid" class="grid">טוען נתונים...</div>
</div>

<div id="modal">
    <div class="modal-content">
        <button onclick="document.getElementById('modal').style.display='none'">✖ סגור</button>
        <div id="modal-body"></div>
    </div>
</div>

<script>
    const REPO = "shantupai/personalaccounts";
    const ENERGY_MAP = { '#laundry': 10, '#bike': 15, '#led': 50, '#shower': 5 };
    const ICON_MAP = { 'בית': '🏠', 'תחבורה': '🚲', 'כביסה': '🧺', 'כללי': '📊' };

    async function fetchData() {
        try {
            const res = await axios.get(`https://api.github.com/repos/${REPO}/issues`);
            const issues = res.data;
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            for (let issue of issues) {
                const comments = await axios.get(issue.comments_url);
                const allContent = issue.body + " " + comments.data.map(c => c.body).join(" ");
                
                // חישוב ג'אולים לפי מילות מפתח
                let total = 0;
                Object.keys(ENERGY_MAP).forEach(key => {
                    const count = (allContent.match(new RegExp(key, 'g')) || []).length;
                    total += count * ENERGY_MAP[key];
                });

                // חילוץ תמונות
                const imgRegex = /!\[.*?\]\((.*?)\)/g;
                let images = [];
                let match;
                while ((match = imgRegex.exec(allContent)) !== null) images.push(match[1]);

                // יצירת כרטיס
                const icon = Object.keys(ICON_MAP).find(k => issue.title.includes(k)) || '🌱';
                const card = document.createElement('div');
                card.className = 'account-card';
                card.innerHTML = `
                    <div class="icon-circle">${icon}</div>
                    <h3>${issue.title}</h3>
                    <div class="total-joules">${total} Joulies</div>
                    <small>${images.length} תמונות תועדו</small>
                `;
                card.onclick = () => showAccount(issue.title, images, total);
                grid.appendChild(card);
            }
        } catch (e) { console.error(e); }
    }

    function showAccount(title, images, total) {
        const modal = document.getElementById('modal');
        const body = document.getElementById('modal-body');
        modal.style.display = 'block';
        body.innerHTML = `
            <h2>${title}</h2>
            <p>סך חיסכון מצטבר: <b>${total}</b> יחידות ג'אולי</p>
            <hr>
            <div class="image-gallery">
                ${images.map(img => `<img src="${img}">`).join('')}
            </div>
            <button class="btn" style="background:orange" onclick="transfer('${title}')">העברת ג'אולים</button>
        `;
    }

    function transfer(from) {
        const password = prompt("הכנס סיסמת חשבון לאימות:");
        if(password) {
            alert(`מעביר ג'אולים מחשבון ${from}... (בגרסה הבאה יתחבר ל-API לכתיבה)`);
        }
    }

    fetchData();
</script>
</body>
</html>
